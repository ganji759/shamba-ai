# Low-memory build settings. The build machine has about 1.5 GB of free RAM.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=640m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
# Stop an idle daemon after 10 minutes so it gives the memory back.
org.gradle.daemon.idletimeout=600000

# Compile Kotlin inside the Gradle daemon. This removes the second JVM (the Kotlin daemon).
kotlin.compiler.execution.strategy=in-process
# If you switch back to the daemon strategy, keep the Kotlin daemon small.
kotlin.daemon.jvmargs=-Xmx512m -XX:+UseSerialGC
kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true
