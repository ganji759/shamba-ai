[project]
name = "shamba-ml"
version = "2.0.0"
description = "Train, export and run the Shamba AI crop-health model with PyTorch ExecuTorch"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [{ name = "Pacifique Mugisho" }]
dependencies = [
  "torch>=2.10",
  "torchvision>=0.25",
  "executorch>=1.5.1",
  "timm>=1.0",
  "huggingface_hub>=1.0",
  "pyarrow>=18",
  "pillow>=11",
  "numpy>=2",
  "pyyaml>=6",
  "typer>=0.15",
  "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
shamba = "shamba_ml.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shamba_ml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
